{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Document{% endblock %}</title>
    {% block extra_css %}
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
    {% endblock %}
</head>
<body>
    {% block content %} 
    {% endblock %}

    {% block extra_js %}
    <script src="{% static 'main/js/script.js' %}"></script>
    {% endblock %}
</body>
</html>
