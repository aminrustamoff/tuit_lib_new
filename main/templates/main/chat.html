{% extends 'base.html' %}

{% block title %}AI Yordamchi{% endblock %}

{% block content %}

<style>
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40%           { opacity: 1;   transform: scale(1.1); }
  }

  .chat-wrapper {
    display: flex;
    flex-direction: column;
    height: 80vh;
    max-width: 820px;
    margin: 0 auto;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .chat-header {
    background: var(--primary);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-header .dot {
    width: 9px; height: 9px;
    background: #4fffb0;
    border-radius: 50%;
  }
  .chat-header h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .chat-header span { font-size: 12px; opacity: 0.75; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--surface-low);
  }

  .chat-input-area {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 16px;
    background: var(--surface-card);
    border-top: 1px solid var(--border);
  }
  .chat-input-area textarea {
    flex: 1;
    resize: none;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 10px 15px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
    outline: none;
    line-height: 1.5;
    background: var(--surface);
    color: var(--text);
    transition: border-color 0.2s;
  }
  .chat-input-area textarea:focus {
    border-color: var(--primary);
  }
  .send-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, transform 0.1s;
    box-shadow: var(--shadow-xs);
  }
  .send-btn:hover    { background: var(--primary-dark); transform: scale(1.05); }
  .send-btn:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; }

  .welcome {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 16px 0;
  }
</style>

<div class="chat-wrapper">

  <!-- <div class="chat-header">
    <div class="dot"></div>
    <div>
      <h2>AI Yordamchi</h2>
      <span>Kitoblar va qo'llanmalar bo'yicha maslahatchi</span>
    </div>
  </div> -->

  <div class="chat-messages" id="chat-box">
    <div class="welcome">
      Salom, <strong>{{ user.get_full_name|default:user.username }}</strong>!
      Kitoblar yoki qo'llanmalar haqida savol bering.
    </div>
  </div>

  <div class="chat-input-area">
    <textarea
      id="user-input"
      rows="1"
      placeholder="Savol yozing... (Enter — yuborish, Shift+Enter — yangi qator)"
    ></textarea>
    <button class="send-btn" id="send-btn" title="Yuborish">&#9658;</button>
  </div>

</div>

<script>
  const history = [];
  const chatBox  = document.getElementById('chat-box');
  const input    = document.getElementById('user-input');
  const sendBtn  = document.getElementById('send-btn');

  input.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function scrollToBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addMessage(role, html) {
    const row = document.createElement('div');
    row.style.cssText = `
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin-bottom: 10px;
      flex-direction: ${role === 'user' ? 'row-reverse' : 'row'};
    `;

    const avatar = document.createElement('div');
    avatar.style.cssText = `
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
      flex-shrink: 0;
      ${role === 'user'
        ? 'background: var(--primary); color: #fff; box-shadow: var(--shadow-xs);'
        : 'background: var(--surface-card); border: 1.5px solid var(--border-strong); color: var(--primary);'
      }
    `;
    avatar.textContent = role === 'user'
      ? '{{ user.username|slice:":1"|upper }}'
      : '\uD83E\uDD16';

    const bubble = document.createElement('div');
    bubble.style.cssText = `
      max-width: 65%;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
      box-shadow: var(--shadow-xs);
      ${role === 'user' ? `
        background: var(--primary);
        color: #fff;
        border-radius: var(--radius) var(--radius-sm) var(--radius-sm) var(--radius);
      ` : `
        background: var(--surface-card);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm) var(--radius) var(--radius) var(--radius-sm);
      `}
    `;
    bubble.innerHTML = html;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatBox.appendChild(row);
    scrollToBottom();
  }

  function addTyping() {
    const row = document.createElement('div');
    row.id = 'typing-indicator';
    row.style.cssText = 'display:flex; align-items:flex-end; gap:8px; margin-bottom:10px;';

    const avatar = document.createElement('div');
    avatar.style.cssText = `
      width:34px; height:34px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background: var(--surface-card);
      border: 1.5px solid var(--border-strong);
      font-size:14px; flex-shrink:0;
    `;
    avatar.textContent = '\uD83E\uDD16';

    const bubble = document.createElement('div');
    bubble.style.cssText = `
      padding: 12px 16px;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm) var(--radius) var(--radius) var(--radius-sm);
      display: flex; gap: 5px; align-items: center;
      box-shadow: var(--shadow-xs);
    `;
    bubble.innerHTML = `
      <span style="width:7px;height:7px;border-radius:50%;background:var(--primary-light);display:inline-block;animation:blink 1.2s infinite;"></span>
      <span style="width:7px;height:7px;border-radius:50%;background:var(--primary-light);display:inline-block;animation:blink 1.2s infinite 0.2s;"></span>
      <span style="width:7px;height:7px;border-radius:50%;background:var(--primary-light);display:inline-block;animation:blink 1.2s infinite 0.4s;"></span>
    `;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatBox.appendChild(row);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function sendMessage() {
    const prompt = input.value.trim();
    if (!prompt || sendBtn.disabled) return;

    addMessage('user', escapeHtml(prompt));
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    addTyping();

    history.push({ role: 'user', text: prompt });

    try {
      const res = await fetch("{% url 'main:chat-ask' %}", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({ prompt, history })
      });

      const data = await res.json();
      removeTyping();

      if (data.answer) {
        addMessage('ai', data.answer);
        history.push({ role: 'assistant', text: data.answer });
      } else {
        addMessage('ai', `<i style="color:var(--error)">Xato: ${escapeHtml(data.error || "Noma'lum xato")}</i>`);
      }
    } catch (e) {
      removeTyping();
      addMessage('ai', `<i style="color:var(--error)">Ulanishda muammo yuz berdi.</i>`);
    }

    sendBtn.disabled = false;
    input.focus();
  }
</script>

{% endblock %}
